{% extends 'base_dashboard.html' %}
{% block title %}Edit task | Daymark{% endblock %}
{% block content %}
<p><a class="muted" href="{% url 'task_detail' task.pk %}">← Back to task</a></p>
<section class="panel" style="margin-top:25px">
    <p class="muted">Edit task</p>
    <h1 style="font-size:3rem">Make it clearer.</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="full">
                <label>Title</label>
                <input name="task" value="{{ task.task }}" required maxlength="250">
            </div>
            <div class="full">
                <label>Description</label>
                <textarea name="description">{{ task.description }}</textarea>
            </div>
            <div>
                <label>Priority</label>
                <select name="priority">
                    {% for value, label in priorities %}
                        <option value="{{ value }}" {% if task.priority == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Category</label>
                <select name="category">
                    <option value="">No category</option>
                    {% for value, label in categories %}
                        <option value="{{ value }}" {% if task.category == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Due date</label>
                <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}">
            </div>
            <div>
                <label>Task color</label>
                <input type="color" name="color" value="{{ task.color }}" title="Choose task color">
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" name="is_favorite" {% if task.is_favorite %}checked{% endif %} style="width:auto">
                    Favorite task
                </label>
            </div>
        </div>
        <div class="form-actions">
            <button class="button" type="submit">Save changes</button>
            <a class="button secondary" href="{% url 'task_detail' task.pk %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
